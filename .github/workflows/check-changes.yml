# Runs the pre-flight check on proposed changes (pull requests), before they reach the site.
# It has read-only access and no secrets, so a stranger's pull request cannot misuse it.
name: Check proposed changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check_site.py
